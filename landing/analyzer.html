<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Risk Analyzer - AI Job Risk Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7ff;
            min-height: 100vh;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.3rem; font-weight: bold; text-decoration: none; color: white; }
        .nav-links { display: flex; gap: 1rem; align-items: center; }
        .nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.9rem; }
        .nav-btn { background: rgba(255,255,255,0.2); padding: 0.4rem 1rem; border-radius: 20px; font-weight: 600; color: white !important; }

        main { max-width: 820px; margin: 2.5rem auto; padding: 0 1.5rem 4rem; }

        .hero { text-align: center; margin-bottom: 2rem; }
        .hero h1 { font-size: 1.9rem; color: #2c3e50; }
        .hero p { color: #666; margin-top: 0.4rem; }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(102,126,234,0.11);
            padding: 2rem;
            margin-bottom: 1.5rem;
        }
        .card h2 { font-size: 1.05rem; font-weight: 700; color: #2c3e50; margin-bottom: 1.25rem; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group { margin-bottom: 1.1rem; }

        label { display: block; font-weight: 500; font-size: 0.87rem; margin-bottom: 0.35rem; color: #444; }

        input[type="text"], textarea {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border: 1.5px solid #dde1f0;
            border-radius: 8px;
            font-size: 0.95rem;
            background: #fafbff;
            color: #333;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
            background: white;
        }
        textarea { resize: vertical; min-height: 90px; }

        /* Multi-select tags */
        .tag-select { border: 1.5px solid #dde1f0; border-radius: 8px; background: #fafbff; padding: 0.5rem; min-height: 48px; }
        .tag-select:focus-within { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }

        .tags-container { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.4rem; }
        .tag {
            background: #667eea;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .tag button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0;
            line-height: 1;
            opacity: 0.75;
        }
        .tag button:hover { opacity: 1; }

        .tag-input-row { display: flex; gap: 0.5rem; }
        .tag-input-row select {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 0.9rem;
            color: #333;
            padding: 0.25rem;
        }
        .tag-input-row select:focus { outline: none; }

        .add-tag-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.25rem 0.7rem;
            font-size: 0.82rem;
            cursor: pointer;
        }
        .add-tag-btn:hover { background: #5a6fd6; }

        .error-box {
            display: none;
            background: #fdf0ef;
            border: 1px solid #f5c6c2;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #c0392b;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .analyze-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }
        .analyze-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
        .analyze-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Result */
        .result-card { display: none; }
        .result-card h2 { font-size: 1.1rem; color: #2c3e50; margin-bottom: 1.5rem; }

        .risk-meter {
            text-align: center;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 1.25rem;
        }
        .risk-low      { background: #eafaf1; border: 2px solid #27ae60; }
        .risk-moderate { background: #fef9e7; border: 2px solid #f39c12; }
        .risk-high     { background: #fdedec; border: 2px solid #e74c3c; }

        .risk-score { font-size: 4rem; font-weight: 800; line-height: 1; }
        .risk-low      .risk-score { color: #27ae60; }
        .risk-moderate .risk-score { color: #f39c12; }
        .risk-high     .risk-score { color: #e74c3c; }

        .risk-label { font-size: 0.9rem; font-weight: 700; margin-top: 0.5rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
        .risk-explanation { margin-top: 0.75rem; font-size: 0.87rem; opacity: 0.7; max-width: 320px; margin-left: auto; margin-right: auto; }

        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem; }
        .detail-box { background: #f8f9ff; border-radius: 10px; padding: 1rem 1.25rem; }
        .detail-box .lbl { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .detail-box .val { font-size: 1.1rem; font-weight: 700; color: #2c3e50; margin-top: 0.2rem; }

        .try-again-btn {
            width: 100%;
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 0.7rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .try-again-btn:hover { background: #667eea; color: white; }

        @media (max-width: 560px) {
            .form-row, .details-grid { grid-template-columns: 1fr; }
            .hero h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<header>
    <a href="/" class="logo">🤖 AI Job Risk Analyzer</a>
    <div class="nav-links">
        <a href="/login">Sign In</a>
        <a href="/signup" class="nav-btn">Sign Up Free</a>
    </div>
</header>

<main>
    <div class="hero">
        <h1>Will Your Job Be Automated?</h1>
        <p>Enter your job details for an instant AI automation risk score.</p>
    </div>

    <!-- Form -->
    <div class="card" id="formCard">
        <div class="error-box" id="errorBox"></div>
        <form id="analyzeForm">

            <div class="form-row">
                <div class="form-group">
                    <label for="jobTitle">Job Title *</label>
                    <input type="text" id="jobTitle" placeholder="e.g. Mechanical Engineer" required>
                </div>
                <div class="form-group">
                    <label for="jobDesc">Key Responsibilities *</label>
                    <input type="text" id="jobDesc" placeholder="e.g. designs and tests mechanical systems" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Skills</label>
                    <div class="tag-select" id="skillsBox">
                        <div class="tags-container" id="skillsTags"></div>
                        <div class="tag-input-row">
                            <select id="skillsSelect"><option value="">— select a skill —</option></select>
                            <button type="button" class="add-tag-btn" onclick="addTag('skills')">Add</button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Knowledge Areas</label>
                    <div class="tag-select" id="knowledgeBox">
                        <div class="tags-container" id="knowledgeTags"></div>
                        <div class="tag-input-row">
                            <select id="knowledgeSelect"><option value="">— select knowledge —</option></select>
                            <button type="button" class="add-tag-btn" onclick="addTag('knowledge')">Add</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Abilities</label>
                <div class="tag-select" id="abilitiesBox">
                    <div class="tags-container" id="abilitiesTags"></div>
                    <div class="tag-input-row">
                        <select id="abilitiesSelect"><option value="">— select an ability —</option></select>
                        <button type="button" class="add-tag-btn" onclick="addTag('abilities')">Add</button>
                    </div>
                </div>
            </div>

            <button type="submit" class="analyze-btn" id="analyzeBtn">Analyze My Job →</button>
        </form>
    </div>

    <!-- Result -->
    <div class="card result-card" id="resultCard">
        <h2>📊 Your AI Automation Risk</h2>
        <div class="risk-meter" id="riskMeter">
            <div class="risk-score" id="riskScore">–</div>
            <div class="risk-label" id="riskLabel">–</div>
            <div class="risk-explanation" id="riskExplanation"></div>
        </div>
        <div class="details-grid">
            <div class="detail-box">
                <div class="lbl">Sector</div>
                <div class="val" id="detailSector">–</div>
            </div>
            <div class="detail-box">
                <div class="lbl">Risk Level</div>
                <div class="val" id="detailRisk">–</div>
            </div>
        </div>
        <button class="try-again-btn" onclick="resetForm()">← Analyze Another Job</button>
    </div>
</main>

<script>
const SKILLS = ["Active Learning","Active Listening","Complex Problem Solving","Coordination","Critical Thinking","Equipment Maintenance","Equipment Selection","Installation","Instructing","Judgment and Decision Making","Learning Strategies","Management of Financial Resources","Management of Material Resources","Management of Personnel Resources","Mathematics","Monitoring","Negotiation","Operation and Control","Operations Analysis","Operations Monitoring","Persuasion","Programming","Quality Control Analysis","Reading Comprehension","Repairing","Science","Service Orientation","Social Perceptiveness","Speaking","Systems Analysis","Systems Evaluation","Technology Design","Time Management","Troubleshooting","Writing"];
const KNOWLEDGE = ["Administration and Management","Administrative","Biology","Building and Construction","Chemistry","Communications and Media","Computers and Electronics","Customer and Personal Service","Design","Economics and Accounting","Education and Training","Engineering and Technology","English Language","Fine Arts","Food Production","Foreign Language","Geography","History and Archeology","Law and Government","Mathematics","Mechanical","Medicine and Dentistry","Personnel and Human Resources","Philosophy and Theology","Physics","Production and Processing","Psychology","Public Safety and Security","Sales and Marketing","Sociology and Anthropology","Telecommunications","Therapy and Counseling","Transportation"];
const ABILITIES = ["Arm-Hand Steadiness","Auditory Attention","Category Flexibility","Control Precision","Deductive Reasoning","Depth Perception","Dynamic Flexibility","Dynamic Strength","Explosive Strength","Extent Flexibility","Far Vision","Finger Dexterity","Flexibility of Closure","Fluency of Ideas","Glare Sensitivity","Gross Body Coordination","Gross Body Equilibrium","Hearing Sensitivity","Inductive Reasoning","Information Ordering","Manual Dexterity","Mathematical Reasoning","Memorization","Multilimb Coordination","Near Vision","Night Vision","Number Facility","Oral Comprehension","Oral Expression","Originality","Perceptual Speed","Peripheral Vision","Problem Sensitivity","Rate Control","Reaction Time","Response Orientation","Selective Attention","Sound Localization","Spatial Orientation","Speech Clarity","Speech Recognition","Speed of Closure","Speed of Limb Movement","Stamina","Static Strength","Time Sharing","Trunk Strength","Visual Color Discrimination","Visualization","Wrist-Finger Speed","Written Comprehension","Written Expression"];

const selected = { skills: [], knowledge: [], abilities: [] };

function populateSelect(id, list) {
    const sel = document.getElementById(id + 'Select');
    list.forEach(item => {
        const opt = document.createElement('option');
        opt.value = opt.textContent = item;
        sel.appendChild(opt);
    });
}
populateSelect('skills', SKILLS);
populateSelect('knowledge', KNOWLEDGE);
populateSelect('abilities', ABILITIES);

function addTag(type) {
    const sel = document.getElementById(type + 'Select');
    const val = sel.value;
    if (!val || selected[type].includes(val)) return;
    selected[type].push(val);
    renderTags(type);
    sel.value = '';
}

function removeTag(type, val) {
    selected[type] = selected[type].filter(v => v !== val);
    renderTags(type);
}

function renderTags(type) {
    const container = document.getElementById(type + 'Tags');
    container.innerHTML = '';
    selected[type].forEach(val => {
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.innerHTML = `${val}<button type="button" onclick="removeTag('${type}','${val}')" title="Remove">×</button>`;
        container.appendChild(tag);
    });
}

const explanations = {
    high:     'High proportion of tasks AI can replicate. Consider upskilling in creativity, leadership, or complex judgment.',
    moderate: 'Partially at risk. Some tasks may be automated, but human oversight remains important.',
    low:      'Strong resistance to automation — relies on skills difficult for AI to replicate.',
};

document.getElementById('analyzeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('analyzeBtn');
    const errBox = document.getElementById('errorBox');
    errBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Analyzing…';

    try {
        const res = await fetch('/api/v1/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                job_title:       document.getElementById('jobTitle').value.trim(),
                job_description: document.getElementById('jobDesc').value.trim(),
                skills:    selected.skills,
                knowledge: selected.knowledge,
                abilities: selected.abilities,
            }),
        });

        const data = await res.json();
        if (!res.ok) {
            errBox.textContent = data.detail || 'Analysis failed. Please try again.';
            errBox.style.display = 'block';
            return;
        }
        showResult(data);
    } catch (err) {
        errBox.textContent = 'Network error — please try again.';
        errBox.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Analyze My Job →';
    }
});

function showResult(data) {
    const pct = Math.round(data.ai_proneness * 100) + '%';
    const level = data.risk_level;
    document.getElementById('riskMeter').className = 'risk-meter risk-' + level;
    document.getElementById('riskScore').textContent = pct;
    document.getElementById('riskLabel').textContent = level + ' risk';
    document.getElementById('riskExplanation').textContent = explanations[level] || '';
    document.getElementById('detailSector').textContent = data.sector || '–';
    document.getElementById('detailRisk').textContent = level.charAt(0).toUpperCase() + level.slice(1);
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('resultCard').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
    document.getElementById('formCard').style.display = 'block';
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('analyzeForm').reset();
    selected.skills = []; selected.knowledge = []; selected.abilities = [];
    ['skills','knowledge','abilities'].forEach(t => renderTags(t));
}
</script>
</body>
</html>

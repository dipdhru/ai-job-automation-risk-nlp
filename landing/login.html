<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AI Job Risk Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7ff;
            min-height: 100vh;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.3rem; font-weight: bold; text-decoration: none; color: white; }
        .back-link { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { opacity: 0.7; }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 1.5rem;
        }

        .page-title { text-align: center; margin-bottom: 2rem; }
        .page-title h1 { font-size: 1.9rem; color: #2c3e50; }
        .page-title p { color: #666; margin-top: 0.4rem; }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(102,126,234,0.12);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
        }

        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 500; font-size: 0.9rem; margin-bottom: 0.4rem; color: #444; }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #dde1f0;
            border-radius: 8px;
            font-size: 1rem;
            background: #fafbff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.12); background: white; }

        .error-box {
            display: none;
            background: #fdf0ef;
            border: 1px solid #f5c6c2;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #c0392b;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.9rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }
        .submit-btn:hover:not(:disabled) { opacity: 0.92; transform: translateY(-1px); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #666;
        }
        .signup-link a { color: #667eea; text-decoration: none; font-weight: 500; }
        .signup-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<header>
    <a href="/" class="logo">🤖 AI Job Risk Analyzer</a>
    <a href="/" class="back-link">← Back to Home</a>
</header>

<main>
    <div class="page-title">
        <h1>Sign In</h1>
        <p>Welcome back — let's check your risk score.</p>
    </div>

    <div class="card">
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required>
            </div>
            <div class="error-box" id="errorBox"></div>
            <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
        </form>
    </div>

    <div class="signup-link">
        Don't have an account? <a href="/signup">Sign up free</a>
    </div>
</main>

<script>
    // If already logged in, go to dashboard
    if (localStorage.getItem('token')) {
        window.location.href = '/dashboard';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorBox = document.getElementById('errorBox');
        const btn = document.getElementById('submitBtn');

        errorBox.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Signing in…';

        try {
            const res = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });

            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('token', data.access_token);
                window.location.href = '/dashboard';
            } else {
                errorBox.textContent = data.detail || data.error || 'Invalid email or password.';
                errorBox.style.display = 'block';
            }
        } catch (err) {
            errorBox.textContent = 'Network error. Please try again.';
            errorBox.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    });
</script>
</body>
</html>
